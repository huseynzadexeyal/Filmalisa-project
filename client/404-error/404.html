<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/client/404-error/404.css" />
  </head>
  <body>
    <div id="sidebar-placeholder" data-type="app"></div>

    <!-- MAIN -->
    <main class="content">
      <div class="not-found">
        <img
          src="/assets/images/404-error.svg"
          alt="Lost"
          class="not-found-img"
        />
        <h1 class="not-found-title">Lost your way?</h1>
        <p class="not-found-text">
          Oops! This is awkward. You are looking for something that doesn't
          actually exist.
        </p>
        <a href="/index.html" class="go-home-btn">Go Home</a>
      </div>
    </main>
    <script src="/global/layout.js"></script>
  </body>
</html>
