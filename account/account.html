<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filmalisa - Account</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- BOOTSTRAP ICONS (Avatar İkonları İçin) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- ACCOUNT CSS -->
    <link rel="stylesheet" href="account.css" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img
          src="../assets/images/filmalisa.svg"
          alt="Filmalisa Logo"
          class="svg-logo"
        />
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link" title="Home">
          <img src="../assets/icons/home.svg" alt="Home" class="svg-icon" />
        </a>
        <a href="#" class="sidebar-link" title="Movies/Series">
          <img src="../assets/icons/search.svg" alt="Movies" class="svg-icon" />
        </a>
        <!-- Aktif olan Account Sayfası -->
        <a href="./account.html" class="sidebar-link active" title="Account">
          <img
            src="../assets/icons/account-active.svg"
            alt="Account"
            class="svg-icon active-icon"
          />
        </a>
        <a href="#" class="sidebar-link" title="Favorites">
          <img
            src="../assets/icons/favourite.svg"
            alt="Favorites"
            class="svg-icon"
          />
        </a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <!-- Varsayılan İkonlu Profil Alanı -->
      <div class="avatar-container" id="avatarContainer">
        <!-- Fotoğraf yüklenmediyse gösterilecek ikon -->
        <div class="avatar-placeholder" id="avatarPlaceholder">
          <i class="bi bi-person-fill"></i>
          <span class="upload-badge"><i class="bi bi-camera-fill"></i></span>
        </div>

        <!-- Yüklenen fotoğraf buraya gelecek (başta gizli) -->
        <img src="" alt="Profile" class="avatar-img d-none" id="avatarImg" />
      </div>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        style="display: none"
      />

      <!-- FORM -->
      <form id="accountForm" class="account-form">
        <div class="input-wrapper">
          <img src="../assets/icons/login2.svg" class="input-icon" alt="user" />
          <input type="text" id="username" placeholder="Profile manage url" />
          <img src="../assets/icons/passwordtog.svg" class="action-icon" alt="toggle" />
        </div>

        <div class="input-wrapper">
          <img src="../assets/icons/login2.svg" class="input-icon" alt="user" />
          <input type="text" id="fullName" placeholder="Full Name" />
          <img src="../assets/icons/passwordtog.svg" class="action-icon" alt="toggle" />
        </div>

        <div class="input-wrapper disabled-wrapper">
          <img src="../assets/icons/login.svg" class="input-icon" alt="email" />
          <input type="email" id="email" disabled />
        </div>

        <div class="input-wrapper">
          <img src="../assets/icons/login2.svg" class="input-icon" alt="lock" />
          <input type="password" id="password" placeholder="Password" />
          <img src="../assets/icons/passwordtog.svg" class="action-icon" alt="toggle" />
        </div>

        <button type="submit" class="save-btn">Save</button>
      </form>
    </main>

    <script src="account.js"></script>
  </body>
</html>
