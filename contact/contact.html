<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us — Filmalisa Admin</title>
    <link rel="stylesheet" href="/contact/contact.css" />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar_menu">
          <div class="sidebar_logo">
            <img src="/assets/icons/image 1.svg" alt="Filmalisa logo" />
            <h4 class="logo-title">Filmalisa</h4>
          </div>

          <nav class="sidebar_menu_nav">
            <ul>
              <li>
                <a href="/dashboard/dashboard.html" class="sidebar_link">
                  <img src="/assets/icons/Dashboard.svg" alt="" />
                  <span>Dashboard</span>
                </a>
              </li>
              <li>
                <a href="/movies/movies.html" class="sidebar_link">
                  <img src="/assets/icons/Movies.svg" alt="" />
                  <span>Movies</span>
                </a>
              </li>
              <li>
                <a href="/categories/categories.html" class="sidebar_link">
                  <img src="/assets/icons/Categories.svg" alt="" />
                  <span>Categories</span>
                </a>
              </li>
              <li>
                <a href="/users/users.html" class="sidebar_link">
                  <img src="/assets/icons/Users.svg" alt="" />
                  <span>Users</span>
                </a>
              </li>
              <li>
                <a href="/comments/comments.html" class="sidebar_link">
                  <img src="/assets/icons/Comments.svg" alt="" />
                  <span>Comments</span>
                </a>
              </li>
              <li>
                <a href="/contact/contact.html" class="sidebar_link active">
                  <img src="/assets/icons/Contact us.svg" alt="" />
                  <span>Contact us</span>
                </a>
              </li>
              <li>
                <a href="/actors/actors.html" class="sidebar_link active">
                  <img src="/assets/icons/Users.svg" alt="" />
                  <span>Actors</span>
                </a>
              </li>
            </ul>
          </nav>

          <a
            href="/login/login.html"
            class="sidebar_link_logout"
            id="logoutBtn"
          >
            <img src="/assets/icons/Logout.svg" alt="" />
            <span>Logout</span>
          </a>
        </aside>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Contact Requests</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <img src="/assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <table class="table_content">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Message</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="contactTableBody">
              <!-- JS ilə doldurulacaq -->
            </tbody>
          </table>
        </main>
      </div>
    </div>

    <!-- Təsdiq Modalı -->
    <div class="modalDiv" id="deleteModal">
      <div class="modalContent">
        <button
          class="close"
          id="closeModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <div class="modal-body">
          <h3 class="modal-title">Bu əlaqə müraciətini silmək istəyirsiniz?</h3>
          <p class="modal-text">Bu əməliyyat geri qaytarıla bilməz.</p>
          <div class="modal-actions">
            <button
              id="cancelDeleteBtn"
              class="category-form__submit btn-cancel"
              type="button"
            >
              Ləğv et
            </button>
            <button
              id="confirmDeleteBtn"
              class="category-form__submit btn-danger"
              type="button"
            >
              Bəli, Sil
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="/contact/contact.js"></script>
  </body>
</html>
