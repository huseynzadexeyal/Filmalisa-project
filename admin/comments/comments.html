<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comments — Filmalisa Admin</title>
    <link rel="stylesheet" href="./comments.css" />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <div
          id="sidebar-placeholder"
          data-type="admin"
          data-active="comments"
        ></div>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Comments</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <img src="../../assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <table class="table_content">
            <thead>
              <tr>
                <th>ID</th>
                <th>Movie</th>
                <th>User Comment</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="commentsTableBody">
              <tr data-id="1">
                <td>1</td>
                <td>
                  <div class="cell-movie">
                    <img
                      src="../../assets/images/wonder-woman.svg"
                      alt="Wonder Woman poster"
                    />
                    <span>Wonder Woman</span>
                  </div>
                </td>
                <td class="cell-comment">
                  Bu film həyatımı dəyişdi, vizuallar möhtəşəmdir! Çox qarışıq
                  idi amma yenə də bəyəndim.
                </td>
                <td>
                  <button
                    class="table-btn table-btn--delete"
                    type="button"
                    title="Delete"
                  >
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>

              <tr data-id="2">
                <td>2</td>
                <td>
                  <div class="cell-movie">
                    <img
                      src="../../assets/images/lost-in-space-poster.svg"
                      alt="Lost in Space poster"
                    />
                    <span>Lost in Space</span>
                  </div>
                </td>
                <td class="cell-comment">
                  Hans Zimmer musiqiləri bir başqadır. Çox təsirləndim.
                </td>
                <td>
                  <button
                    class="table-btn table-btn--delete"
                    type="button"
                    title="Delete"
                  >
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </main>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modalDiv" id="deleteModal">
      <div class="modalContent modalContent--small">
        <button
          class="close"
          id="closeModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <div class="modal-body">
          <h3 class="modal-title"></h3>
          <p class="modal-text">This action cannot be undone after deletion.</p>
          <div class="modal-actions">
            <button
              id="cancelDeleteBtn"
              class="category-form__submit btn-cancel"
              type="button"
            >
              Cancel
            </button>
            <button
              id="confirmDeleteBtn"
              class="category-form__submit btn-danger"
              type="button"
            >
              Yes, Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../global/layout.js"></script>
    <script src="./comments.js"></script>
  </body>
</html>
