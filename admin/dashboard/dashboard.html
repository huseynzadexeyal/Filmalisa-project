<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Filmalisa Admin</title>
    <link rel="stylesheet" href="/admin/dashboard/dashboard.css" />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <div id="sidebar-placeholder" data-type="admin" data-active="dashboard"></div>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Dashboard</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <img src="/assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <div class="dashboards_cards">
            <div class="card">
              <p>Favorite actions</p>
              <h3>121</h3>
            </div>
            <div class="card">
              <p>Users</p>
              <h3>10</h3>
            </div>
            <div class="card">
              <p>Movies</p>
              <h3>40</h3>
            </div>
            <div class="card">
              <p>Comments</p>
              <h3>45</h3>
            </div>
            <div class="card">
              <p>Categories</p>
              <h3>12</h3>
            </div>
            <div class="card">
              <p>Actors</p>
              <h3>20</h3>
            </div>
            <div class="card">
              <p>Contacts</p>
              <h3>20</h3>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="/global/layout.js"></script>
    <script src="/admin/dashboard/dashboard.js"></script>
  </body>
</html>
