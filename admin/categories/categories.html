<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories — Filmalisa Admin</title>
    <link rel="stylesheet" href="/admin/categories/categories.css" />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <div id="sidebar-placeholder" data-type="admin" data-active="categories"></div>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Categories</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <button class="button" id="createCategoryBtn" type="button">
                Create
              </button>
              <img src="/assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <table class="table_content">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="categoriesTableBody">
              <tr data-id="1">
                <td>1</td>
                <td class="cell-name">Action</td>
                <td>
                  <button class="table-btn table-btn--edit" type="button">
                    Edit
                  </button>
                  <button class="table-btn table-btn--delete" type="button">
                    Delete
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </main>
      </div>
    </div>

    <!-- Create / Edit category modal -->
    <div class="modalDiv" id="categoryModal">
      <div class="modalContent">
        <button
          class="close"
          id="closeModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>

        <form id="categoryForm" class="category-form">
          <input
            class="category-form__input"
            type="text"
            id="categoryName"
            placeholder="category name"
            required
          />
          <button class="category-form__submit" type="submit">Submit</button>
        </form>
      </div>
    </div>

    <script src="/global/layout.js"></script>
    <script src="/admin/categories/categories.js"></script>
  </body>
</html>
