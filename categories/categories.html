<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories — Filmalisa Admin</title>
    <link rel="stylesheet" href="/categories/categories.css" />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar_menu">
          <div class="sidebar_logo">
            <img src="/assets/icons/image 1.svg" alt="Filmalisa logo" />
            <h4 class="logo-title">Filmalisa</h4>
          </div>

          <nav class="sidebar_menu_nav">
            <ul>
              <li>
                <a href="/dashboard/dashboard.html" class="sidebar_link">
                  <img src="/assets/icons/Dashboard.svg" alt="" />
                  <span>Dashboard</span>
                </a>
              </li>
              <li>
                <a href="/movies/movies.html" class="sidebar_link">
                  <img src="/assets/icons/Movies.svg" alt="" />
                  <span>Movies</span>
                </a>
              </li>
              <li>
                <a href="/categories/categories.html" class="sidebar_link">
                  <img src="/assets/icons/Categories.svg" alt="" />
                  <span>Categories</span>
                </a>
              </li>
              <li>
                <a href="/users/users.html" class="sidebar_link">
                  <img src="/assets/icons/Users.svg" alt="" />
                  <span>Users</span>
                </a>
              </li>
              <li>
                <a href="/comments/comments.html" class="sidebar_link">
                  <img src="/assets/icons/Comments.svg" alt="" />
                  <span>Comments</span>
                </a>
              </li>
              <li>
                <a href="/contact/contact.html" class="sidebar_link">
                  <img src="/assets/icons/Contact us.svg" alt="" />
                  <span>Contact us</span>
                </a>
              </li>
            </ul>
          </nav>

          <a
            href="/login/login.html"
            class="sidebar_link_logout"
            id="logoutBtn"
          >
            <img src="/assets/icons/Logout.svg" alt="" />
            <span>Logout</span>
          </a>
        </aside>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Categories</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <button class="button" id="createCategoryBtn" type="button">
                Create
              </button>
              <img src="/assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <table class="table_content">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="categoriesTableBody">
              <tr data-id="1">
                <td>1</td>
                <td class="cell-name">Action</td>
                <td>
                  <button class="table-btn table-btn--edit" type="button">
                    Edit
                  </button>
                  <button class="table-btn table-btn--delete" type="button">
                    Delete
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </main>
      </div>
    </div>

    <!-- Create / Edit category modal -->
    <div class="modalDiv" id="categoryModal">
      <div class="modalContent">
        <button
          class="close"
          id="closeModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>

        <form id="categoryForm" class="category-form">
          <input
            class="category-form__input"
            type="text"
            id="categoryName"
            placeholder="category name"
            required
          />
          <button class="category-form__submit" type="submit">Submit</button>
        </form>
      </div>
    </div>

    <script src="/categories/categories.js"></script>
  </body>
</html>
