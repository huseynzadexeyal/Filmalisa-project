<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actors — Filmalisa Admin</title>
    <link rel="stylesheet" href="/actors/actors.css" />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar_menu">
          <div class="sidebar_logo">
            <img src="/assets/icons/image 1.svg" alt="Filmalisa logo" />
            <h4 class="logo-title">Filmalisa</h4>
          </div>

          <nav class="sidebar_menu_nav">
            <ul>
              <li>
                <a href="/dashboard/dashboard.html" class="sidebar_link">
                  <img src="/assets/icons/Dashboard.svg" alt="" />
                  <span>Dashboard</span>
                </a>
              </li>
              <li>
                <a href="/movies/movies.html" class="sidebar_link">
                  <img src="/assets/icons/Movies.svg" alt="" />
                  <span>Movies</span>
                </a>
              </li>
              <li>
                <a href="/categories/categories.html" class="sidebar_link">
                  <img src="/assets/icons/Categories.svg" alt="" />
                  <span>Categories</span>
                </a>
              </li>
              <li>
                <a href="/users/users.html" class="sidebar_link">
                  <img src="/assets/icons/Users.svg" alt="" />
                  <span>Users</span>
                </a>
              </li>
              <li>
                <a href="/comments/comments.html" class="sidebar_link">
                  <img src="/assets/icons/Comments.svg" alt="" />
                  <span>Comments</span>
                </a>
              </li>

              <li>
                <a href="/contact/contact.html" class="sidebar_link">
                  <img src="/assets/icons/Contact us.svg" alt="" />
                  <span>Contact us</span>
                </a>
              </li>
              <li>
                <a href="/actors/actors.html" class="sidebar_link active">
                  <img src="/assets/icons/Users.svg" alt="" />
                  <span>Actors</span>
                </a>
              </li>
            </ul>
          </nav>

          <a
            href="/login/login.html"
            class="sidebar_link_logout"
            id="logoutBtn"
          >
            <img src="/assets/icons/Logout.svg" alt="" />
            <span>Logout</span>
          </a>
        </aside>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Actors</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <!-- Create Düyməsi -->
              <button class="button" id="createActorBtn" type="button">
                Create
              </button>
              <img src="/assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <table class="table_content">
            <thead>
              <tr>
                <th>ID</th>
                <th>Photo & Name</th>
                <th>Biography / Role</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="actorsTableBody">
              <!-- JS ilə doldurulacaq -->
            </tbody>
          </table>
        </main>
      </div>
    </div>

    <!-- Create / Edit Modal -->
    <div class="modalDiv" id="actorModal">
      <div class="modalContent">
        <button
          class="close"
          id="closeModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>

        <form id="actorForm" class="category-form">
          <h3 class="modal-title" id="modalTitle">Create Actor</h3>

          <input
            class="category-form__input"
            type="text"
            id="actorName"
            placeholder="Actor Name"
            required
          />
          <input
            class="category-form__input"
            type="url"
            id="actorImage"
            placeholder="Image URL (e.g. https://...)"
            required
          />
          <input
            class="category-form__input"
            type="text"
            id="actorBio"
            placeholder="Biography or Role"
            required
          />

          <button class="category-form__submit" type="submit">Submit</button>
        </form>
      </div>
    </div>

    <script src="/actors/actors.js"></script>
  </body>
</html>
