              </li>
              <li>
                <a href="/movies/movies.html" class="sidebar_link">
                  <img src="/assets/icons/Movies.svg" alt="" />

              <li>

                  <img src="/assets/icons/Categories.svg" alt="" />

              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>

              </tr>

            <tbody id="usersTableBody">
